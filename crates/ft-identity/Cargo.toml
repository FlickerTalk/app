[package]
name = "ft-identity"
version = "0.1.0"
edition = "2021"
description = "Cryptographic identity of the device: the Olm account, device_id and signatures"
license = "AGPL-3.0-only"

[dependencies]
anyhow = "1"
blake3 = "1"
bs58 = "0.5"
chacha20poly1305 = "0.10"
crypto_box = { version = "0.9", features = ["seal"] }
vodozemac = "0.11"
