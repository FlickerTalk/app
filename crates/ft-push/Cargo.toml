[package]
name = "ft-push"
version = "0.1.0"
edition = "2021"
description = "Client of the router: signed requests, signalling, mailbox and TURN credentials"
license = "AGPL-3.0-only"

[dependencies]
anyhow = "1"
async-trait = "0.1"
base64 = "0.22"
blake3 = "1"
futures-util = "0.3"
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider", "json"] }
# TLS on ring, the stack webrtc already builds for Android; roots from webpki-roots.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt", "sync", "time"] }
tokio-tungstenite = { version = "0.30", features = ["rustls-tls-webpki-roots"] }
uuid = { version = "1.18", features = ["v7"] }
webpki-roots = "1"

[dev-dependencies]
axum = "0.8"
ed25519-dalek = "3"
ft-identity = { path = "../ft-identity" }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time", "net"] }
