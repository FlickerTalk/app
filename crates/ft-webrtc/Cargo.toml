[package]
name = "ft-webrtc"
version = "0.1.0"
edition = "2021"
description = "Peer-to-peer sessions over WebRTC data channels"
license = "AGPL-3.0-only"

[dependencies]
anyhow = "1"
async-trait = "0.1"
bytes = "1"
if-addrs = "0.15"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt", "sync", "time"] }
webrtc = "0.21"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
