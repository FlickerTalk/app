[package]
name = "ft-media"
version = "0.1.0"
edition = "2021"
description = "Native call media: the call's peer connection, and the audio and video pipelines of webrtc-engine"
license = "AGPL-3.0-only"

[dependencies]
anyhow = "1"
async-trait = "0.1"
tokio = { version = "1", features = ["macros", "rt", "sync", "time"] }
rtc = "0.21"
webrtc = "0.21"
webrtc-engine = { git = "https://github.com/FlickerTalk/webrtc-engine-rs", rev = "0b93777c808b639937f5c65628124d077180b9d8" }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time"] }

[features]
testing = []
