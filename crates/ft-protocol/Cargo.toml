[package]
name = "ft-protocol"
version = "0.1.0"
edition = "2021"
description = "FlickerTalk wire protocol: versioned CBOR packets, sealed envelopes and signals"
license = "AGPL-3.0-only"

[dependencies]
anyhow = "1"
ciborium = "0.2"
serde = { version = "1", features = ["derive"] }
serde_bytes = "0.11"
uuid = { version = "1", features = ["v7", "serde"] }
