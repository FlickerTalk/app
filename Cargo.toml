[workspace]
resolver = "2"
# Crates are added here as they appear (Plan §82).
members = ["src-tauri", "src-tauri/platform", "crates/ft-webrtc", "crates/ft-poc", "crates/ft-identity", "crates/ft-protocol", "crates/ft-crypto", "crates/ft-contacts", "crates/ft-storage", "crates/ft-core", "crates/ft-push", "crates/ft-plugins", "crates/ft-billing", "crates/ft-circles", "crates/ft-vault", "crates/ft-media"]

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

# Proc-macros and build scripts run on the build machine, not in the app: stripping them breaks
# the proc-macro dylibs on macOS with Xcode 27's toolchain ("mis-aligned LINKEDIT string pool").
[profile.release.build-override]
strip = false

# The recovery phrase is stretched with Argon2id (64 MiB, 3 passes): unoptimized it takes tens of
# seconds, in the tests and in a debug build on a phone. Optimized, as in a release, it is ~1 s.
[profile.dev.package.argon2]
opt-level = 3
[profile.dev.package.blake2]
opt-level = 3
