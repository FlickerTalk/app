[workspace]
resolver = "2"
# Crates are added here as they appear (Plan §82).
members = ["src-tauri", "src-tauri/platform", "crates/ft-webrtc", "crates/ft-poc", "crates/ft-identity", "crates/ft-protocol", "crates/ft-crypto", "crates/ft-contacts", "crates/ft-storage", "crates/ft-core", "crates/ft-push", "crates/ft-plugins", "crates/ft-billing"]

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

# Proc-macros and build scripts run on the build machine, not in the app: stripping them breaks
# the proc-macro dylibs on macOS with Xcode 27's toolchain ("mis-aligned LINKEDIT string pool").
[profile.release.build-override]
strip = false
