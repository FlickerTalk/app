[workspace]
resolver = "2"
# Crates are added here as they appear (Plan §82).
members = ["src-tauri", "src-tauri/platform", "crates/ft-webrtc", "crates/ft-poc", "crates/ft-identity", "crates/ft-protocol", "crates/ft-crypto", "crates/ft-contacts", "crates/ft-storage", "crates/ft-core", "crates/ft-push", "crates/ft-plugins", "crates/ft-billing", "crates/ft-circles", "crates/ft-vault", "crates/ft-media"]

# iOS release builds with Xcode 27 (Swift 6.4). SwiftPM now builds with Swift Build, which in the
# release configuration prelinks each Swift module (`ld -r`) and so turns the non-`public`
# `@_cdecl` entry points of Tauri, its plugins and swift-rs into local symbols: the link fails
# with "Undefined symbols" (tauri-apps/tauri#16130). swift-rs 1.0.8 makes each package's own
# entry points global again, but not those of its shared runtime (`SwiftRs.o`: `retain_object`,
# `release_object`, `string_from_bytes`, `data_from_bytes`; Brendonovich/swift-rs#81). This is
# 1.0.8 plus Brendonovich/swift-rs#80, which also exports them, from the one archive named by
# `SWIFT_RS_RUNTIME_ARCHIVE` (`.cargo/config.toml`). Needs `rustup component add llvm-tools`.
# We keep our own copy of that commit (FlickerTalk/swift-rs, branch `flickertalk-xcode27`), so the
# build does not depend on a third party's repository. Drop it once a swift-rs release includes
# the fix.
[patch.crates-io]
swift-rs = { git = "https://github.com/FlickerTalk/swift-rs", rev = "aaf38d45ab3a4b10a5af3a3dbc64424e998fae8c" }

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

# Proc-macros and build scripts run on the build machine, not in the app: stripping them breaks
# the proc-macro dylibs on macOS with Xcode 27's toolchain ("mis-aligned LINKEDIT string pool").
[profile.release.build-override]
strip = false

# The recovery phrase is stretched with Argon2id (64 MiB, 3 passes): unoptimized it takes tens of
# seconds, in the tests and in a debug build on a phone. Optimized, as in a release, it is ~1 s.
[profile.dev.package.argon2]
opt-level = 3
[profile.dev.package.blake2]
opt-level = 3
