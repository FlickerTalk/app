# Tests every change. Every push to main publishes a signed "canary" APK (a prerelease); every
# version tag (vX.Y.Z) publishes a release with the signed APK and AAB (Plan §105).
#
# The signing key, Firebase's file and the Google OAuth client ids live only in the `release`
# environment, which only main and v* tags can use: pull requests (forks included) build unsigned
# and never see them. The job that signs cannot write to the repo, and the one that publishes never
# sees a secret. (FT_GOOGLE_IOS_CLIENT_ID waits there for an iOS job; iOS is built on a Mac.)
name: app

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: app-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npx vite build
      # End-to-end tests of the UI against a fake core (e2e/), in Playwright's own Chromium.
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7

  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: System libraries for Tauri
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libssl-dev
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable
          components: clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked

  android:
    needs: [web, rust]
    runs-on: ubuntu-latest
    # Pull requests build without an environment, so without secrets. ('' is falsy in expressions:
    # the empty branch has to come last.)
    environment: ${{ github.event_name != 'pull_request' && 'release' || '' }}
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - id: version
        name: Version (a tag must match tauri.conf.json)
        run: |
          version=$(jq -r .version src-tauri/tauri.conf.json)
          if [[ "$GITHUB_REF" == refs/tags/v* && "$GITHUB_REF_NAME" != "v$version" ]]; then
            echo "::error::tag $GITHUB_REF_NAME does not match version $version in tauri.conf.json"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable
          targets: aarch64-linux-android
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: android
      - run: npm ci
      - name: Signing key and Firebase
        if: github.event_name != 'pull_request'
        env:
          UPLOAD_KEYSTORE: ${{ secrets.ANDROID_UPLOAD_KEYSTORE }}
          GOOGLE_SERVICES: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          echo "$UPLOAD_KEYSTORE" | base64 -d > "$RUNNER_TEMP/upload.jks"
          echo "ANDROID_UPLOAD_KEYSTORE_FILE=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"
          echo "$GOOGLE_SERVICES" | base64 -d > src-tauri/gen/android/app/google-services.json
      - name: Build
        env:
          ANDROID_UPLOAD_KEY_ALIAS: ${{ secrets.ANDROID_UPLOAD_KEY_ALIAS }}
          ANDROID_UPLOAD_PASSWORD: ${{ secrets.ANDROID_UPLOAD_PASSWORD }}
          # Google Drive sign-in (docs/drive.md): the Android OAuth client goes into the core and
          # the bridge's manifest. A release without it does not build (src-tauri/build.rs), except
          # a pull request's, which is never published and has no secrets.
          FT_GOOGLE_CLIENT_ID: ${{ secrets.FT_GOOGLE_CLIENT_ID }}
          FT_ALLOW_NO_GOOGLE_CLIENT: ${{ github.event_name == 'pull_request' && '1' || '' }}
        # The runner's own variables are not in the `env` context: the NDK comes from the shell.
        run: |
          export NDK_HOME="${ANDROID_NDK_LATEST_HOME:-$ANDROID_NDK_HOME}"
          npm run tauri android build -- --apk --aab --target aarch64 --ci
      - name: Kotlin tests
        working-directory: src-tauri/gen/android
        run: ./gradlew --no-daemon :tauri-plugin-ft-platform:testDebugUnitTest
      - name: Collect
        run: |
          mkdir -p out
          out=src-tauri/gen/android/app/build/outputs
          apk=$(ls $out/apk/universal/release/*.apk | head -1)
          cp "$apk" "out/FlickerTalk-${{ steps.version.outputs.version }}.apk"
          cp $out/bundle/universalRelease/*.aab "out/FlickerTalk-${{ steps.version.outputs.version }}.aab"
          if [[ "$GITHUB_EVENT_NAME" != pull_request ]]; then
            "$ANDROID_HOME"/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)/apksigner verify out/*.apk
          fi
          ls -l out
      - if: always()
        name: Forget the signing key
        run: rm -f "$RUNNER_TEMP/upload.jks" src-tauri/gen/android/app/google-services.json
      - uses: actions/upload-artifact@v7
        with:
          name: android
          path: out/
          retention-days: 14

  # The App Store gets a release build, and the 1.2.1 one died at every launch while the debug
  # build ran fine (tao freed the UISceneConfiguration it handed to UIKit, 2026-09-30). This builds
  # the release for the simulator, unsigned and without secrets, and fails if it does not stay up.
  ios:
    needs: [web, rust]
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable
          targets: aarch64-apple-ios-sim
          # swift-rs (patched in Cargo.toml) re-exports its runtime with llvm-objcopy.
          components: llvm-tools
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: ios-sim
      - run: npm ci
      - name: Release build for the simulator
        env:
          # Never published: no Google client id (src-tauri/google_client_check.rs).
          TAURI_FT_ALLOW_NO_GOOGLE_CLIENT: "1"
        run: npm run tauri ios build -- --target aarch64-sim --ci
      - name: Launch check
        run: scripts/ios-sim-smoke.sh "" 30
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: ios-crash-reports
          path: ~/Library/Logs/DiagnosticReports/FlickerTalk*.ips
          retention-days: 7

  publish:
    needs: android
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: android
          path: out
      - name: Canary (every push to main)
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release delete canary --cleanup-tag --yes || true
          gh release create canary out/*.apk --prerelease --target "$GITHUB_SHA" --title "Canary" \
            --notes "Latest build of main ($GITHUB_SHA), signed. For testing: it talks to the production router."
      - name: Release (version tags)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release create "$GITHUB_REF_NAME" out/* --verify-tag --title "$GITHUB_REF_NAME" --generate-notes

  # Google Play (Plan §105). The first upload of an AAB has to be done by hand in the Play Console;
  # from then on this job takes over. It does nothing until the service account exists, and it only
  # ever uploads to a testing track: production is always a human decision in the console.
  play:
    needs: [android, publish]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment: release
    env:
      READY: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON != '' && vars.PLAY_PACKAGE_NAME != '' }}
    steps:
      - if: env.READY != 'true'
        run: echo "::notice::no Play service account yet, skipping the upload"
      - if: env.READY == 'true'
        uses: actions/download-artifact@v8
        with:
          name: android
          path: out
      - if: env.READY == 'true'
        uses: r0adkll/upload-google-play@e738b9dd8f2476ea806d921b64aacd24f34515a5 # v1.1.5
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: ${{ vars.PLAY_PACKAGE_NAME }}
          releaseFiles: out/*.aab
          track: ${{ vars.PLAY_TRACK || 'internal' }}
          status: completed
