# Tests every change. Every push to main publishes a signed "canary" APK (a prerelease); every
# version tag (vX.Y.Z) publishes a release with the signed APK and AAB (Plan §105).
#
# The signing key and Firebase's file live only in the `release` environment, which only main and
# v* tags can use: pull requests (forks included) build unsigned and never see them. The job that
# signs cannot write to the repo, and the one that publishes never sees a secret.
name: app

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: app-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npx vite build

  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: System libraries for Tauri
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libssl-dev
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable
          components: clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked

  android:
    needs: [web, rust]
    runs-on: ubuntu-latest
    # Pull requests build without an environment, so without secrets.
    environment: ${{ github.event_name == 'pull_request' && '' || 'release' }}
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - id: version
        name: Version (a tag must match tauri.conf.json)
        run: |
          version=$(jq -r .version src-tauri/tauri.conf.json)
          if [[ "$GITHUB_REF" == refs/tags/v* && "$GITHUB_REF_NAME" != "v$version" ]]; then
            echo "::error::tag $GITHUB_REF_NAME does not match version $version in tauri.conf.json"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable
          targets: aarch64-linux-android
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: android
      - run: npm ci
      - name: Signing key and Firebase
        if: github.event_name != 'pull_request'
        env:
          UPLOAD_KEYSTORE: ${{ secrets.ANDROID_UPLOAD_KEYSTORE }}
          GOOGLE_SERVICES: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          echo "$UPLOAD_KEYSTORE" | base64 -d > "$RUNNER_TEMP/upload.jks"
          echo "ANDROID_UPLOAD_KEYSTORE_FILE=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"
          echo "$GOOGLE_SERVICES" | base64 -d > src-tauri/gen/android/app/google-services.json
      - name: Build
        env:
          NDK_HOME: ${{ env.ANDROID_NDK_LATEST_HOME }}
          ANDROID_UPLOAD_KEY_ALIAS: ${{ secrets.ANDROID_UPLOAD_KEY_ALIAS }}
          ANDROID_UPLOAD_PASSWORD: ${{ secrets.ANDROID_UPLOAD_PASSWORD }}
        run: npm run tauri android build -- --apk --aab --target aarch64 --ci
      - name: Kotlin tests
        working-directory: src-tauri/gen/android
        run: ./gradlew --no-daemon :tauri-plugin-ft-platform:testDebugUnitTest
      - name: Collect
        run: |
          mkdir -p out
          out=src-tauri/gen/android/app/build/outputs
          apk=$(ls $out/apk/universal/release/*.apk | head -1)
          cp "$apk" "out/FlickerTalk-${{ steps.version.outputs.version }}.apk"
          cp $out/bundle/universalRelease/*.aab "out/FlickerTalk-${{ steps.version.outputs.version }}.aab"
          if [[ "$GITHUB_EVENT_NAME" != pull_request ]]; then
            "$ANDROID_HOME"/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)/apksigner verify out/*.apk
          fi
          ls -l out
      - if: always()
        name: Forget the signing key
        run: rm -f "$RUNNER_TEMP/upload.jks" src-tauri/gen/android/app/google-services.json
      - uses: actions/upload-artifact@v7
        with:
          name: android
          path: out/
          retention-days: 14

  publish:
    needs: android
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: android
          path: out
      - name: Canary (every push to main)
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release delete canary --cleanup-tag --yes || true
          gh release create canary out/*.apk --prerelease --target "$GITHUB_SHA" --title "Canary" \
            --notes "Latest build of main ($GITHUB_SHA), signed. For testing: it talks to the production router."
      - name: Release (version tags)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release create "$GITHUB_REF_NAME" out/* --verify-tag --title "$GITHUB_REF_NAME" --generate-notes
