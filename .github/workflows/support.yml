# The support contact's image (crates/ft-support, plan of the Apple review 1.7.1): built on every
# pull request that changes it, and published to GHCR on every push to main that changes it, as
# `latest` and `sha-<commit>`. Its tests run with the rest of the workspace in app.yml.
#
# Deploying is by hand for now (infra: stacks/support/stack.yml, runbooks/support-peer.md): the
# stack pulls `latest`. A change in ft-core alone does not rebuild it: the protocol is backward
# compatible, and workflow_dispatch rebuilds it on demand.
name: support

on:
  pull_request:
    paths:
      - crates/ft-support/**
      - .github/workflows/support.yml
  push:
    branches: [main]
    paths:
      - crates/ft-support/**
      - .github/workflows/support.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: support-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/flickertalk/ft-support

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      # Only main publishes: a pull request, or a manual run on another branch, only builds.
      - if: github.ref == 'refs/heads/main'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: crates/ft-support/Dockerfile
          push: ${{ github.ref == 'refs/heads/main' }}
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:sha-${{ github.sha }}
          labels: org.opencontainers.image.source=https://github.com/FlickerTalk/app
          cache-from: type=gha,scope=ft-support
          cache-to: type=gha,mode=max,scope=ft-support
