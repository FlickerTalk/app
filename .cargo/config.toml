# Google Play requires native libraries aligned to 16 KB pages for Android 15+ devices
# https://developer.android.com/guide/practices/page-sizes
[target.aarch64-linux-android]
rustflags = ["-C", "link-arg=-Wl,-z,max-page-size=16384"]

[target.x86_64-linux-android]
rustflags = ["-C", "link-arg=-Wl,-z,max-page-size=16384"]

# The patched swift-rs (see Cargo.toml) exports its runtime symbols from this one archive only.
# Every Tauri iOS app links Tauri once, so a second global copy isn't wanted.
[env]
SWIFT_RS_RUNTIME_ARCHIVE = "Tauri"
