[package]
name = "flickertalk"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "flickertalk_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-opener = "2"
tauri-plugin-ft-platform = { path = "platform" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ft-contacts = { path = "../crates/ft-contacts" }
ft-core = { path = "../crates/ft-core" }
ft-storage = { path = "../crates/ft-storage" }
ft-webrtc = { path = "../crates/ft-webrtc" }
anyhow = "1"
rand = "0.9"
tokio = { version = "1", features = ["sync", "fs", "io-util", "time"] }
base64 = "0.22"

# QR codes of Contact Cards (Plan §32): the camera scanner exists on phones only.
[target.'cfg(any(target_os = "android", target_os = "ios"))'.dependencies]
tauri-plugin-barcode-scanner = "2"
