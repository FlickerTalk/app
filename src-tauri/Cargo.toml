[package]
name = "flickertalk"
version = "1.5.0"
description = "FlickerTalk: private messages, phone to phone (the Tauri app around ft-core)"
authors = ["FlickerTalk"]
license = "AGPL-3.0-only"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "flickertalk_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
# 2.12 at least: it brings tao 0.37, whose iOS scene configuration is no longer freed before UIKit
# takes it (tauri-apps/tao#1244, #1245). With tao 0.35 every release build crashed at launch.
tauri = { version = "2.12", features = ["protocol-asset"] }
tauri-plugin-opener = "2"
tauri-plugin-ft-platform = { path = "platform" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ft-contacts = { path = "../crates/ft-contacts" }
ft-billing = { path = "../crates/ft-billing" }
ft-core = { path = "../crates/ft-core" }
ft-plugins = { path = "../crates/ft-plugins" }
ft-push = { path = "../crates/ft-push" }
ft-storage = { path = "../crates/ft-storage" }
ft-vault = { path = "../crates/ft-vault" }
ft-webrtc = { path = "../crates/ft-webrtc" }
ft-media = { path = "../crates/ft-media" }
anyhow = "1"
async-trait = "0.1"
rand = "0.9"
tokio = { version = "1", features = ["sync", "fs", "io-util", "time"] }
base64 = "0.22"

# A call push starts the core with the app closed (2026-10-01, src/push_core.rs): Kotlin and Rust
# call each other over JNI. The same version Tauri and tao already use.
[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21"

# QR codes of Contact Cards (Plan §32): the camera scanner exists on phones only.
[target.'cfg(any(target_os = "android", target_os = "ios"))'.dependencies]
tauri-plugin-barcode-scanner = "2"
