<!-- FlickerTalk app icon: the brand mark (two devices, a direct dashed link) in white on the Ember
     gradient. Full bleed: iOS rounds the corners and Android masks the adaptive icon itself. The
     mark stays inside the central 60 %, the adaptive icon's safe zone. -->
<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="ember" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffa24c"/>
      <stop offset="1" stop-color="#ff6a3d"/>
    </linearGradient>
  </defs>
  <rect width="1024" height="1024" fill="url(#ember)"/>
  <g transform="translate(512 512) scale(20) translate(-16 -16)" fill="none">
    <circle cx="8" cy="24" r="4" fill="#fff" opacity="0.62"/>
    <circle cx="24" cy="8" r="4" fill="#fff"/>
    <path d="M11.5 20.5 20.5 11.5" stroke="#fff" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="3 4"/>
  </g>
</svg>
